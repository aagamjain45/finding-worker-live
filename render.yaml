# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: finding-worker-backend
    runtime: docker
    dockerfilePath: ./finding-worker-release/Dockerfile
    dockerContext: ./finding-worker-release
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: JPA_SHOW_SQL
        value: "false"
